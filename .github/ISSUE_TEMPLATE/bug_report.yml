name: Bug report
description: Report something that is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. A minimal reproduction that runs
        with `node --test` is the fastest way for us to help.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what actually happened?
      placeholder: I expected can-i-deploy to pass, but it exited 1 with...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A spec + consumer snippet, or a failing test. Keep it as small as possible.
      render: js
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `npm ls @vijaypjavvadi/usagecontract`
      placeholder: 1.3.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`
      placeholder: v20.11.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Command and full output
      description: The exact command you ran and its complete output.
      render: shell
