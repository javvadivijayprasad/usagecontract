name: Feature request
description: Suggest a new capability or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the use case first, then the proposed API. Check
        [ROADMAP.md](../blob/main/ROADMAP.md) — it may already be planned.
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you trying to do, and why can't you do it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: How would you like this to work? Sketch the API if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you are using now, or other approaches you weighed.
