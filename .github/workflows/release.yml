name: release
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*", "!v*.*.*-*"]          # a pre-release tag (v2.0.0-rc.1) publishes nothing
  workflow_dispatch:
    inputs:
      dry_run: { description: "Build, test and package only - publish nothing", type: boolean, default: true }
permissions:
  contents: write    # the GitHub release
  id-token: write    # trusted publishing (npm and Marketplace)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test --workspaces --if-present          # core + extension unit tests
      - run: npm run --workspace packages/core test:coverage   # enforce the core coverage floor

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: The tag matches both package versions
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          core=$(node -p "require('./packages/core/package.json').version")
          ext=$(node -p "require('./packages/vscode/package.json').version")
          echo "tag $tag, core $core, extension $ext"
          [ "$tag" = "$core" ] || { echo "::error::core is $core but the tag is v$tag"; exit 1; }
          [ "$tag" = "$ext" ]  || { echo "::error::extension is $ext but the tag is v$tag"; exit 1; }

      - name: What would ship (npm)
        working-directory: packages/core
        run: npm pack --dry-run

      - name: Publish core to npm (trusted publishing, no token)
        if: env.DRY_RUN != 'true'
        working-directory: packages/core
        run: |
          name=$(node -p "require('./package.json').name")
          v=$(node -p "require('./package.json').version")
          if npm view "$name@$v" version >/dev/null 2>&1; then
            echo "$name@$v is already on npm - skipping"
          else
            npm publish --provenance --access public
          fi

      - name: Package the extension
        working-directory: packages/vscode
        run: npx @vscode/vsce@4.1.0 package --no-dependencies

      - name: Publish the extension to the Marketplace (trusted publishing, no token)
        if: env.DRY_RUN != 'true'
        working-directory: packages/vscode
        run: |
          v=$(node -p "require('./package.json').version")
          live=$(npx @vscode/vsce@4.1.0 show vijaypjavvadi.usagecontract --json 2>/dev/null | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).versions[0].version}catch{''}")
          if [ "$live" = "$v" ]; then
            echo "vijaypjavvadi.usagecontract $v is already on the Marketplace - skipping"
          else
            npx @vscode/vsce@4.1.0 publish --oidc --no-dependencies --packagePath usagecontract-*.vsix
          fi

      - name: GitHub release (Zenodo archives it)
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists - skipping"
          else
            gh release create "$GITHUB_REF_NAME" --title "usagecontract $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md packages/vscode/usagecontract-*.vsix
          fi
